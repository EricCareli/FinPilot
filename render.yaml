services:
  - type: web
    name: finpilot-api
    runtime: node
    plan: free
    rootDir: backend

    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start

    healthCheckPath: /health/ready

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_FROM
        sync: false

      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: finpilot-web
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://finpilot-api-vhfj.onrender.com

databases:
  - name: finpilot-db
    plan: free
    databaseName: finpilot
    user: finpilot