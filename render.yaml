services:
  - type: web
    name: finpilot-api
    runtime: node
    plan: free
    rootDir: backend

    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start

    healthCheckPath: /health/ready

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_FROM
        sync: false

      - key: CORS_ORIGIN
        sync: false

databases:
  - name: finpilot-db
    plan: free
    databaseName: finpilot
    user: finpilot
